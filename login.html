<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | PharmacyGuides26 Talent</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #eef2ff, #ecfeff);
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px;
      border-radius: 22px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.12);
    }

    .logo {
      text-align: center;
      font-size: 24px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 8px;
    }

    .logo span {
      color: #5b5ff0;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: 600;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #6366f1;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 11px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
    }

    .register-link {
      text-align: center;
      margin-top: 20px;
      color: #6b7280;
    }

    .register-link a {
      color: #5b5ff0;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      PharmacyGuides<span>26</span> Talent
    </div>

    <p class="subtitle">
      Login to your student account
    </p>

    <form id="loginForm">

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >


      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >


      <button type="submit" id="loginBtn">
        Login
      </button>

    </form>


    <div id="message"></div>


    <div class="register-link">

      Don't have an account?

      <a href="register.html">
        Create Account
      </a>

    </div>

  </div>


  <script type="module">

    import { auth } from "./firebase-config.js";

    import {
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    const form =
      document.getElementById("loginForm");

    const message =
      document.getElementById("message");

    const button =
      document.getElementById("loginBtn");


    form.addEventListener("submit", async (e) => {

      e.preventDefault();


      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      button.disabled = true;
      button.textContent = "Logging in...";
      message.textContent = "";


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


        message.style.color = "green";

        message.textContent =
          "Login successful!";


        setTimeout(() => {

          window.location.href =
            "dashboard.html";

        }, 800);


      } catch (error) {

        console.error(error);

        message.style.color = "red";


        if (
          error.code === "auth/invalid-credential" ||
          error.code === "auth/wrong-password" ||
          error.code === "auth/user-not-found"
        ) {

          message.textContent =
            "Incorrect email or password.";

        } else if (
          error.code === "auth/invalid-email"
        ) {

          message.textContent =
            "Please enter a valid email address.";

        } else {

          message.textContent =
            "Login failed. Please try again.";

        }

      } finally {

        button.disabled = false;

        button.textContent = "Login";

      }

    });

  </script>

</body>
</html>
