<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Events | PharmacyGuides26 Talent</title>
<style>
*{box-sizing:border-box;font-family:Arial;margin:0}
body{background:#f4f6ff;color:#172033}
header{background:#fff;padding:18px 7%;display:flex;justify-content:space-between;box-shadow:0 2px 10px #0000000d}
.logo{font-size:21px;font-weight:800}.logo span{color:#5b5cf6}
button{border:0;border-radius:9px;padding:12px 18px;font-weight:bold;cursor:pointer}
.back{background:#625cf5;color:#fff}
main{width:90%;max-width:900px;margin:30px auto}
.hero,.card{background:#fff;border-radius:18px;padding:25px;margin-bottom:22px;box-shadow:0 8px 25px #0000000b}
.hero{background:linear-gradient(135deg,#5856e8,#914cf5);color:white}
h1{margin-bottom:7px}h2{margin-bottom:18px}
label{display:block;font-weight:bold;margin:14px 0 7px}
input,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px}
.create{width:100%;margin-top:20px;background:linear-gradient(135deg,#5b5cf6,#914cf5);color:white}
.event{border:1px solid #e1e3ef;padding:18px;border-radius:14px;margin-top:14px}
.status{display:inline-block;padding:5px 10px;border-radius:20px;background:#eee;margin-top:10px;font-weight:bold}
.msg{text-align:center;margin-top:12px;font-weight:bold}
</style>
</head>

<body>

<header>
<div class="logo">PharmacyGuides<span>26</span> Talent</div>
<button class="back" onclick="location.href='index.html'">← Admin Dashboard</button>
</header>

<main>

<div class="hero">
<h1>📅 Live Event Management</h1>
<p>Schedule quizzes with date, start time and duration.</p>
</div>

<div class="card">
<h2>➕ Create Live Event</h2>

<label>Select Quiz</label>
<select id="quiz">
<option>Loading quizzes...</option>
</select>

<label>Event Date</label>
<input type="date" id="date">

<label>Start Time</label>
<input type="time" id="time">

<label>Duration (minutes)</label>
<input type="number" id="duration" value="30" min="1">

<button class="create" id="create">🚀 Create Live Event</button>

<div class="msg" id="msg"></div>
</div>

<div class="card">
<h2>📡 Scheduled Events</h2>
<div id="events">Loading events...</div>
</div>

</main>

<script type="module">

import {auth,db} from "../firebase-config.js";

import {onAuthStateChanged}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
collection,getDocs,addDoc,serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const quiz=document.getElementById("quiz");
const date=document.getElementById("date");
const time=document.getElementById("time");
const duration=document.getElementById("duration");
const create=document.getElementById("create");
const msg=document.getElementById("msg");
const events=document.getElementById("events");

onAuthStateChanged(auth,async user=>{
if(!user){
location.href="../login.html";
return;
}
await loadQuizzes();
await loadEvents();
});

async function loadQuizzes(){
try{
const snap=await getDocs(collection(db,"quizzes"));
quiz.innerHTML='<option value="">Select a quiz</option>';

snap.forEach(doc=>{
const d=doc.data();
const o=document.createElement("option");
o.value=doc.id;
o.textContent=d.title||"Untitled Quiz";
quiz.appendChild(o);
});
}catch(e){
quiz.innerHTML='<option>Unable to load quizzes</option>';
}
}

create.addEventListener("click",async()=>{

msg.textContent="";
msg.style.color="";

if(!quiz.value||!date.value||!time.value||!duration.value){
msg.textContent="Please fill all fields.";
msg.style.color="red";
return;
}

try{

const start=new Date(`${date.value}T${time.value}`);

await addDoc(collection(db,"events"),{
quizId:quiz.value,
date:date.value,
startTime:time.value,
startTimestamp:start,
duration:Number(duration.value),
status:"scheduled",
createdAt:serverTimestamp()
});

msg.textContent="✅ Live event created successfully!";
msg.style.color="green";

await loadEvents();

}catch(e){
console.error(e);
msg.textContent="❌ Could not create event. Check Firestore permissions.";
msg.style.color="red";
}

});

async function loadEvents(){

try{

const snap=await getDocs(collection(db,"events"));

if(snap.empty){
events.innerHTML="<p>No live events created yet.</p>";
return;
}

events.innerHTML="";

snap.forEach(doc=>{

const d=doc.data();

const div=document.createElement("div");
div.className="event";

div.innerHTML=`
<strong>📚 Quiz Event</strong>
<p style="margin-top:8px">📅 ${d.date||""}</p>
<p>⏰ ${d.startTime||""}</p>
<p>⏱️ ${d.duration||0} minutes</p>
<span class="status">🟡 ${d.status||"scheduled"}</span>
`;

events.appendChild(div);

});

}catch(e){

console.error(e);
events.innerHTML="<p>Could not load events.</p>";

}

}

</script>

</body>
</html>
